# Default configuration = local development against Anvil (`anvil --block-time 1`, or `docker compose up`).
# The keys below are Anvil's well-known dev accounts; they hold no value anywhere else.
# Account 0 is the treasury, accounts 1-5 are the signer pool.

[server]
port = 8080

[database]
url = "postgres://gum_engine:gum_engine@127.0.0.1:54330/gum_engine"

[webhook]
signing_secret = "dev-secret"

[signers]
mode = "local"
local_private_keys = [
  "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d",
  "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a",
  "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6",
  "0x47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a",
  "0x8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba",
]

# Anvil is the local chain and finalizes immediately: the `geth` kind's defaults already say
# confirmation_delay_ms = 0 (confirmed on receipt, no re-check) and liveness = "rpc_responsive".
[chains.anvil]
chain_id = 31337
kind = "geth"
rpc_url = "http://127.0.0.1:8545"
treasury_private_key = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
signer_min_balance = "1000000000000000000"       # 1 ETH
topup_amount = "5000000000000000000"             # 5 ETH
treasury_min_balance = "100000000000000000000"   # 100 ETH
