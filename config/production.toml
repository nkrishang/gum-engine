# Production configuration. Secrets never live in this file:
#   DATABASE_URL                       Railway Postgres (private network URL; never via PgBouncer —
#                                      the leader lease is a session-level advisory lock)
#   GUM_WEBHOOK__SIGNING_SECRET        HMAC secret for webhook signatures
#   GUM_SIGNERS__KMS_KEY_IDS           JSON array of KMS key ids/ARNs, e.g. '["1234abcd-…","…"]' (never aliases)
#   RPC_URL_MONAD / RPC_URL_BASE / RPC_URL_ARBITRUM / RPC_URL_ARC   QuickNode endpoint URLs. Deliberately NOT prefixed with
#                                      GUM_: every GUM_* variable is parsed as a config override, and an
#                                      unknown one is a boot error.
#   GUM_CHAINS__<NAME>__TREASURY_KEY_ID  KMS key id of each chain's treasury
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION   IAM user limited to kms:Sign + kms:GetPublicKey
# Seal all of them in Railway.

[database]
url = "set-by-DATABASE_URL"
auto_migrate = true            # the engine applies its own migrations at boot (idempotent; sqlx takes an
                               # advisory lock, so overlapping instances are safe). Deliberately not a
                               # platform pre-deploy step: that is config which can silently go missing.

[webhook]
signing_secret = "set-by-GUM_WEBHOOK__SIGNING_SECRET"

[rpc]
# QuickNode Build plan: 50 RPS account-wide. Stay under it; the limiter backs off further on 429s.
account_rps = 45
monthly_credit_budget = 80000000
# daily_credit_cap = 4000000   # optional hard stop: refuse NEW jobs (503 `shedding`) beyond this per UTC day

[signers]
mode = "kms"
kms_key_ids = []               # set by GUM_SIGNERS__KMS_KEY_IDS; add ids + redeploy to scale the pool

[chains.monad]
chain_id = 143
kind = "monad"
rpc_url_env = "RPC_URL_MONAD"
treasury_key_id = "replace-with-kms-key-id"
# Funding policy. Each account's reserve on Monad is min(10 MON, its balance): a signer holding less than
# 10 MON pays gas normally, but only balance ABOVE 10 MON can be transferred out as value. So the treasury's
# last 10 MON cannot be handed out, and a job that transfers MON needs its signer to hold more than 10 MON.
# Sized for a ~1,000 MON test budget. Settlements cost ~0.045 MON each; a busy signer does ~1-2/s
# (~160-320 MON/hour). Top-ups are kept small so the ten first fundings take 200 MON, not the whole budget,
# and the rest stays in the treasury to follow demand. 20 MON is ~450 settlements, ~4-7 min per busy signer.
initial_topup_amount = "20000000000000000000"     # 20 MON: a signer's first funding
signer_min_balance = "2000000000000000000"        # below 2 MON a signer is topped up...
topup_amount = "20000000000000000000"             # ...with 20 MON
treasury_min_balance = "200000000000000000000"    # alert below 200 MON (~20% of the budget); only the last 10 MON cannot be paid out
# A busy signer needs ~8-16 top-ups/hour; 30 leaves headroom and caps a drained signer at 600 MON/hour.
max_topups_per_signer_per_hour = 30

[chains.base]
chain_id = 8453
kind = "opstack"
rpc_url_env = "RPC_URL_BASE"
treasury_key_id = "replace-with-kms-key-id"
initial_topup_amount = "25000000000000000"        # 0.025 ETH: a signer's first funding
signer_min_balance = "5000000000000000"           # below 0.005 ETH a signer is topped up...
topup_amount = "10000000000000000"                # ...with 0.01 ETH
treasury_min_balance = "100000000000000000"       # alert below 0.1 ETH

[chains.arbitrum]
chain_id = 42161
kind = "arbitrum"
rpc_url_env = "RPC_URL_ARBITRUM"
treasury_key_id = "replace-with-kms-key-id"
initial_topup_amount = "25000000000000000"        # 0.025 ETH: a signer's first funding
signer_min_balance = "5000000000000000"           # below 0.005 ETH a signer is topped up...
topup_amount = "10000000000000000"                # ...with 0.01 ETH
treasury_min_balance = "100000000000000000"       # alert below 0.1 ETH

# Arc (Circle). Uncomment once RPC_URL_ARC and GUM_CHAINS__ARC__TREASURY_KEY_ID are set in Railway and the
# treasury holds USDC. It stays commented until then because a chain without its RPC URL is a boot error.
# Gas is paid in USDC, which has 18 decimals natively (the ERC-20 view at 0x3600…0000 has 6): the amounts below
# are 18-decimal units, so 1 USDC = 1000000000000000000. No public Arc endpoint offers
# eth_sendRawTransactionSync, so the engine sends asynchronously and polls receipts (~3x the RPC calls).
# A settlement costs ~0.002 USDC at the 20 gwei floor, so 5 USDC is ~2,500 settlements per top-up.
# max_job_cost defaults to topup_amount: a job moving more than ~5 USDC of value needs max_job_cost raised,
# and a topup_amount to match.
# [chains.arc]
# chain_id = 5042
# kind = "arc"
# rpc_url_env = "RPC_URL_ARC"
# treasury_key_id = "replace-with-kms-key-id"
# initial_topup_amount = "5000000000000000000"      # 5 USDC: a signer's first funding
# signer_min_balance = "1000000000000000000"        # below 1 USDC a signer is topped up...
# topup_amount = "5000000000000000000"              # ...with 5 USDC
# treasury_min_balance = "50000000000000000000"     # alert below 50 USDC
