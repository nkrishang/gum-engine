# Railway config-as-code for gum-engine.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs after the build and before the new instance starts. The private network (and therefore Postgres)
# is NOT reachable at build time, so migrations belong here, never in the Dockerfile.
preDeployCommand = "gum-engine migrate"

# /healthz never depends on holding the leader lease. Railway waits for the NEW instance to be healthy
# before it stops the OLD one — and the old one holds the lease. Gating health on the lease would
# deadlock every deploy until this timeout.
healthcheckPath = "/healthz"
healthcheckTimeout = 120

# Exactly one instance. Deploys still overlap briefly; the Postgres advisory-lock lease (plus the
# lease_epoch fencing token) is what guarantees only one instance ever drives the signers.
numReplicas = 1
overlapSeconds = 0

# Default is 0 = immediate SIGKILL. The engine needs time to let in-flight sends settle, flush its
# write-behind queue and release the lease. Must stay above server.drain_timeout_ms (25s).
drainingSeconds = 30

restartPolicyType = "ALWAYS"
