[workspace]
resolver = "2"
members = ["crates/gum-engine", "crates/gum-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
alloy = { version = "2.4", default-features = false }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.13"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# added for gum-bench
bytes = "1"
hdrhistogram = { version = "7", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio-postgres = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
