# Local dev + bench dependencies. Ports are offset so they never collide with a host Postgres/Anvil.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gum
      POSTGRES_PASSWORD: gum
      POSTGRES_DB: gum
    ports:
      - "54329:5432"
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gum"]
      interval: 1s
      timeout: 3s
      retries: 30

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "1", "--chain-id", "31337"]
    ports:
      - "8545:8545"
